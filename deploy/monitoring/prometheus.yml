# 044 — scrape TrackForge app metrics on the private compose network.
# METRICS_BEARER expands via --config.expand-env when the app gates /metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trackforge
    metrics_path: /metrics
    scheme: http
    bearer_token: ${METRICS_BEARER}
    static_configs:
      - targets: ['app:3000']
