version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackforge
      POSTGRES_PASSWORD: trackforge
      POSTGRES_DB: trackforge
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # Sprint 029 — SMTP sink for dev/CI mail tests (backend: SMTP_HOST=localhost SMTP_PORT=1025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # web UI

volumes:
  postgres_data:
